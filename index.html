<style>
:root{--bg:#020A05;--glow:#33FF7A;--head:#D8FFE4;--dim:#2E8A4F;--bad:#FF4D4D;--term:#0D1820;
--p1:#C2521A;--p2:#F2D03A;--p3:#1D6786;--p4:#2B7649;--p5:#7A4E2D;--p6:#E58B4E;--p7:#4E9CBB;--p8:#9DB3BE;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--head);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
main::before{content:"";position:absolute;width:min(560px,120vw);height:min(560px,120vw);background:radial-gradient(closest-side,var(--bg) 50%,transparent);z-index:-1}
.wm{font-size:clamp(22px,7vw,34px);font-weight:700;letter-spacing:.3em;padding-left:.3em;color:var(--head);text-shadow:0 0 16px var(--glow)}
.status{font-size:13px;letter-spacing:.12em;color:var(--dim);min-height:1.4em;text-transform:uppercase;text-align:center}
.status::after{content:"\2588";margin-left:4px;color:var(--glow);animation:blink 1s steps(1) infinite}
.status.bad{color:var(--bad)}.status.bad::after{color:var(--bad)}
.status.ok{color:var(--glow)}
@keyframes blink{50%{opacity:0}}
.lockwrap{position:relative;width:min(300px,78vw);aspect-ratio:1}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(min(300px,78vw) * .07)}
.patch{appearance:none;border:0;border-radius:9px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .2s,filter .2s;outline:none;padding:0}
.patch::after{content:"";position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.patch.core{background:var(--term);border:2px solid var(--dim);color:var(--glow);font-family:var(--mono);font-weight:700;font-size:clamp(20px,7vw,30px)}
.patch.core::after{border-color:rgba(51,255,122,.25)}
.patch.hit{transform:scale(.9);box-shadow:0 0 0 3px var(--glow),0 0 26px var(--glow);filter:brightness(1.25)}
.patch:focus-visible{box-shadow:0 0 0 3px var(--head)}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.path polyline{fill:none;stroke:var(--glow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--glow));opacity:.85}
.lockwrap.shake{animation:shake .45s}
.lockwrap.bad .patch{filter:grayscale(.6) brightness(.7)}
.lockwrap.bad svg.path polyline{stroke:var(--bad);filter:drop-shadow(0 0 5px var(--bad))}
.lockwrap.busy .patch{cursor:wait}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.dots{display:flex;gap:7px;min-height:12px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.tries{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tries b{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow);display:inline-block}
.tries b.used{background:transparent;border:1px solid var(--bad);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button.act{appearance:none;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--dim);background:transparent;color:var(--head)}
label.keep{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);letter-spacing:.06em;cursor:pointer}
label.keep input{accent-color:var(--glow);width:16px;height:16px}
.fly{position:fixed;border-radius:6px;pointer-events:none;z-index:5}
.fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
.fade.on{opacity:1}
/* Sperre */
body.lockdown canvas#rain{z-index:26}
.threads{position:fixed;inset:0;width:100%;height:100%;z-index:22;pointer-events:none}
.blackout{position:fixed;inset:0;background:#000;z-index:28;opacity:0;pointer-events:none}
body.lockdown .alarm{z-index:27}

.hole-gl{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s}
.hole-pt{position:fixed;inset:0;width:100%;height:100%;z-index:22;pointer-events:none}
.alarm{position:fixed;inset:0;z-index:23;pointer-events:none;background:radial-gradient(circle,rgba(255,30,30,.15),rgba(255,0,0,.55));opacity:0;mix-blend-mode:screen}
body.holing main{z-index:24}
body.holing main::before{display:none}
.glitch .wm,.glitch .status{animation:glitch .09s steps(2) infinite}
.glitch .lockwrap{animation:gshift .12s steps(2) infinite}
@keyframes glitch{0%{text-shadow:3px 0 #ff2a2a,-3px 0 #2affff;transform:translate(2px,-1px) skewX(8deg)}100%{text-shadow:-4px 0 #ff2a2a,4px 0 #2affff;transform:translate(-3px,1px) skewX(-6deg)}}
@keyframes gshift{0%{transform:translate(4px,0);filter:hue-rotate(90deg) saturate(2)}100%{transform:translate(-4px,2px);filter:hue-rotate(-60deg) contrast(1.6)}}
.void{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .8s;pointer-events:none;text-align:center;padding:16px}
.void.on{opacity:1;pointer-events:auto}
.void b{font-size:15px;letter-spacing:.3em;color:var(--bad);text-shadow:0 0 12px rgba(255,77,77,.6)}
.void span{font-size:12px;letter-spacing:.12em;color:#B05050;text-transform:uppercase}
.void .cd{font-size:40px;font-weight:700;color:#C43C3C;letter-spacing:.1em;font-variant-numeric:tabular-nums}
noscript{color:var(--head);padding:20px;display:block}
@media (prefers-reduced-motion:reduce){.status::after{animation:none}.lockwrap.shake{animation:none}.hole::before{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main id="main">
 <div class="wm">PATCHWORK</div>
 <div class="status" id="status">Kombination eingeben</div>
 <div class="lockwrap" id="lock">
  <div class="grid" id="grid"></div>
  <svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="line" points=""/></svg>
 </div>
 <div class="dots" id="dots" aria-live="polite"></div>
 <div class="tries" id="tries"></div>
 <div class="row"><button class="act" id="clear" type="button">Löschen</button><label class="keep"><input type="checkbox" id="keep"> Auf diesem Gerät merken</label></div>
</main>
<div class="fade" id="fade"></div>
<div class="void" id="void"><b>ACCESS DENIED</b><span>Zu viele Fehlversuche</span><div class="cd" id="cd">1:00</div><span>Neustart danach automatisch</span></div>

let AC=null;

const ROW=[697,770,852],COL=[1209,1336,1477];

 freqs.forEach(f=>{const o=a.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+dur+.02);});}

  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.vy+=G*.5*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt*2.2;if(s.life<=0){sparks.splice(i,1);continue;}ctx.strokeStyle=`rgba(255,${Math.round(210*s.life)},${Math.round(120*s.life)},${s.life})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.025,s.y-s.vy*.025);ctx.stroke();}
  ctx.globalCompositeOperation='source-over';
  if(t>5.6)black.style.opacity=String(sm(5.6,6.2,t));
  if(t<6.4)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
 setTimeout(()=>showVoid(until),6300);
}

function makeMask(W,H){
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const fsz=Math.min(W*.25,H*.17);RAIN.fsz=fsz;x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=`900 ${fsz}px ui-monospace,Menlo,Consolas,monospace`;x.lineWidth=fsz*.08;x.strokeStyle='#fff';x.strokeText('ACCESS',W/2,H/2-fsz*.6);x.strokeText('DENIED',W/2,H/2+fsz*.6);
 x.fillText('ACCESS',W/2,H/2-fsz*.6);x.fillText('DENIED',W/2,H/2+fsz*.6);
 const d=x.getImageData(0,0,W,H).data;const m=new Uint8Array(W*H);for(let i=0;i<W*H;i++)m[i]=d[i*4+3]>100?1:0;
 RAIN.mask=m;RAIN.mw=W;RAIN.mh=H;
}

function showVoid(until){
 const v=document.getElementById('void'),cd=document.getElementById('cd');v.classList.add('on');busy=true;
 const tb=v.querySelector('b'),T='ACCESS DENIED',G='01アイウ#<>/';let f=0;const ti=setInterval(()=>{f++;tb.textContent=T.split('').map((c,i)=>c===' '?' ':f>i*2+6?c:G[Math.floor(Math.random()*G.length)]).join('');if(f>T.length*2+8){clearInterval(ti);tb.textContent=T;}},45);
 const t=setInterval(()=>{const left=until-Date.now();if(left<=0){clearInterval(t);ls.del(BLOCK_LS);ls.del(FAIL_LS);location.reload();return;}const s=Math.ceil(left/1000);cd.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},250);
}

/* ---------- Öffnen ---------- */
function launch(html,music){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pwWithBackup(h){const tag='<script src="backup.js?v=2"><\/script>';return /<\/body>/i.test(h)?h.replace(/<\/body>(?![\s\S]*<\/body>)/i,tag+'</body>'):h+tag;}
 const go=()=>{html=pwWithBackup(html);document.open();document.write(html);document.close();};
 const wait=music?Math.max(1150,unlockTune()*1000+150):1150;
 if(reduce){setTimeout(go,music?wait:0);return;}
 [...grid.children].forEach((p,i)=>{const r=p.getBoundingClientRect();const d=document.createElement('div');d.className='fly';Object.assign(d.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:COLORS[i]==='core'?'var(--term)':'var('+COLORS[i]+')',boxShadow:'0 0 20px var(--glow)'});document.body.appendChild(d);p.style.visibility='hidden';const a=Math.atan2(r.top+r.height/2-innerHeight/2,r.left+r.width/2-innerWidth/2)+(i===4?Math.PI/2:0);const dist=Math.max(innerWidth,innerHeight);d.animate([{transform:'none',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) rotate(${(Math.random()-.5)*540}deg) scale(.4)`,opacity:0}],{duration:900,delay:(music?1280:200)+i*(music?35:90),easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});});
 if(music){const m=document.getElementById('main');setTimeout(()=>m.classList.add('glitch'),620);setTimeout(()=>m.classList.remove('glitch'),1300);}
 setTimeout(()=>document.getElementById('fade').classList.add('on'),wait-500);
 setTimeout(go,wait);
}
document.getElementById('clear').addEventListener('click',clearSeq);
document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))tap(+e.key-1);else if(e.key==='Backspace'&&!busy){seq.pop();draw();}else if(e.key==='Escape')clearSeq();});

/* ---------- Start ---------- */
drawTries();draw();
(async()=>{
 const until=+ls.get(BLOCK_LS)||0;
 if(until>Date.now()){document.querySelector('main').style.visibility='hidden';showVoid(until);return;}
 if(until){ls.del(BLOCK_LS);ls.del(FAIL_LS);fails=0;drawTries();}
 const k=ls.get(KEY_LS);if(!k)return;
 try{busy=true;draw();setStatus('Gespeicherter Schlüssel …');const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt']);const html=await decryptWith(key);setStatus('Zugriff gewährt','ok');launch(html,false);}
 catch(e){ls.del(KEY_LS);busy=false;setStatus('Kombination eingeben');draw();}
})();

/* ---------- Matrix-Regen ---------- */
let swirl=false;
const RAIN={heat:0,speed:1,dens:.65,trans:false,fade:.14,mask:null,mw:0,mh:0,maskA:0,cleared:false,flood:0};
(()=>{const cv=document.getElementById('rain'),ctx=cv.getContext('2d');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const G='アイウエオカキクケコサシスセソタチツテト0123456789<>/#';let W,H,fs=15,cols,drops;
 function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);cols=Math.ceil(W/fs);drops=Array.from({length:cols},()=>Math.random()*-H/fs);}
 size();addEventListener('resize',size);let last=0;
 const gl=()=>G[Math.floor(Math.random()*G.length)];
 const inMask=(x,y)=>{const mx=Math.min(RAIN.mw-1,Math.max(0,Math.round(x+fs/2))),my=Math.min(RAIN.mh-1,Math.max(0,Math.round(y-fs/2)));return RAIN.mask[my*RAIN.mw+mx]===1;};
 (function f(t){requestAnimationFrame(f);if(t-last<60/RAIN.speed)return;last=t;
  if(RAIN.trans){if(!RAIN.cleared){ctx.clearRect(0,0,W,H);RAIN.cleared=true;}ctx.globalCompositeOperation='destination-out';ctx.fillStyle=`rgba(0,0,0,${RAIN.fade})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
  else{ctx.fillStyle='rgba(2,10,5,.14)';ctx.fillRect(0,0,W,H);}
  const h=RAIN.heat,base=`rgb(${Math.round(31+179*h)},${Math.round(158-133*h)},${Math.round(78-53*h)})`,head=h>.5?'#FFD6D6':'#D8FFE4';
  ctx.font=fs+'px monospace';
  const reps=RAIN.trans?1+Math.round(RAIN.flood*3):1;
  for(let i=0;i<cols;i++){if(Math.random()>(RAIN.trans?RAIN.dens:.65)){drops[i]+=1;continue;}
   for(let r=0;r<reps;r++){const x=i*fs,y=drops[i]*fs;const m=RAIN.mask&&RAIN.maskA>0&&inMask(x,y);
    ctx.globalAlpha=m?1:1-RAIN.maskA*.8;ctx.fillStyle=m?'#FFE0E0':(Math.random()<.1?head:base);ctx.fillText(gl(),x,y);ctx.globalAlpha=1;
    if(y>H&&Math.random()>(RAIN.flood>.3?.6:.97))drops[i]=Math.random()*-10;drops[i]+=1;}}
  if(RAIN.flood>0)for(let k=0;k<Math.round(RAIN.flood*90);k++){ctx.fillStyle=Math.random()<.15?head:base;ctx.globalAlpha=(1-RAIN.maskA*.8)*(.5+Math.random()*.5);ctx.fillText(gl(),Math.floor(Math.random()*cols)*fs,Math.floor(Math.random()*H/fs)*fs+fs);ctx.globalAlpha=1;}
  if(RAIN.mask&&RAIN.maskA>0){const g2=7;ctx.font='8px monospace';ctx.shadowColor='#FF2020';ctx.shadowBlur=6;
   for(let gx=0;gx<W;gx+=g2)for(let gy=g2;gy<H+g2;gy+=g2){const mx=Math.min(RAIN.mw-1,gx+3),my=Math.min(RAIN.mh-1,gy-3);if(RAIN.mask[my*RAIN.mw+mx]&&Math.random()<RAIN.maskA*.55){ctx.fillStyle=Math.random()<.3?'#FFFFFF':'#FF4545';ctx.fillText(gl(),gx,gy);}}
   const F=RAIN.fsz;ctx.save();ctx.font=`900 ${F}px ui-monospace,Menlo,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=RAIN.maskA*.8;ctx.shadowBlur=22;ctx.shadowColor='#FF1A1A';ctx.lineWidth=1.6;ctx.strokeStyle='#FF7070';
   ctx.strokeText('ACCESS',W/2,H/2-F*.6);ctx.strokeText('DENIED',W/2,H/2+F*.6);ctx.restore();ctx.shadowBlur=0;}
 })(0);
})();
