<style>
:root{--bg:#020A05;--glow:#33FF7A;--head:#D8FFE4;--dim:#2E8A4F;--bad:#FF4D4D;--term:#0D1820;
--p1:#C2521A;--p2:#F2D03A;--p3:#1D6786;--p4:#2B7649;--p5:#7A4E2D;--p6:#E58B4E;--p7:#4E9CBB;--p8:#9DB3BE;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--head);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
main::before{content:"";position:absolute;width:min(560px,120vw);height:min(560px,120vw);background:radial-gradient(closest-side,var(--bg) 50%,transparent);z-index:-1}
.wm{font-size:clamp(22px,7vw,34px);font-weight:700;letter-spacing:.3em;padding-left:.3em;color:var(--head);text-shadow:0 0 16px var(--glow)}
.status{font-size:13px;letter-spacing:.12em;color:var(--dim);min-height:1.4em;text-transform:uppercase;text-align:center}
.status::after{content:"\2588";margin-left:4px;color:var(--glow);animation:blink 1s steps(1) infinite}
.status.bad{color:var(--bad)}.status.bad::after{color:var(--bad)}
.status.ok{color:var(--glow)}
@keyframes blink{50%{opacity:0}}
.lockwrap{position:relative;width:min(300px,78vw);aspect-ratio:1}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(min(300px,78vw) * .07)}
.patch{appearance:none;border:0;border-radius:9px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .2s,filter .2s;outline:none;padding:0}
.patch::after{content:"";position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.patch.core{background:var(--term);border:2px solid var(--dim);color:var(--glow);font-family:var(--mono);font-weight:700;font-size:clamp(20px,7vw,30px)}
.patch.core::after{border-color:rgba(51,255,122,.25)}
.patch.hit{transform:scale(.9);box-shadow:0 0 0 3px var(--glow),0 0 26px var(--glow);filter:brightness(1.25)}
.patch:focus-visible{box-shadow:0 0 0 3px var(--head)}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.path polyline{fill:none;stroke:var(--glow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--glow));opacity:.85}
.lockwrap.shake{animation:shake .45s}
.lockwrap.bad .patch{filter:grayscale(.6) brightness(.7)}
.lockwrap.bad svg.path polyline{stroke:var(--bad);filter:drop-shadow(0 0 5px var(--bad))}
.lockwrap.busy .patch{cursor:wait}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.dots{display:flex;gap:7px;min-height:12px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.tries{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tries b{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow);display:inline-block}
.tries b.used{background:transparent;border:1px solid var(--bad);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button.act{appearance:none;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--dim);background:transparent;color:var(--head)}
label.keep{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);letter-spacing:.06em;cursor:pointer}
label.keep input{accent-color:var(--glow);width:16px;height:16px}
.fly{position:fixed;border-radius:6px;pointer-events:none;z-index:5}
.fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
.fade.on{opacity:1}
/* Sperre */
body.lockdown canvas#rain{z-index:26}
.threads{position:fixed;inset:0;width:100%;height:100%;z-index:22;pointer-events:none}
.blackout{position:fixed;inset:0;background:#000;z-index:28;opacity:0;pointer-events:none}
body.lockdown .alarm{z-index:27}

.hole-gl{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s}
.hole-pt{position:fixed;inset:0;width:100%;height:100%;z-index:22;pointer-events:none}
.alarm{position:fixed;inset:0;z-index:23;pointer-events:none;background:radial-gradient(circle,rgba(255,30,30,.15),rgba(255,0,0,.55));opacity:0;mix-blend-mode:screen}
body.holing main{z-index:24}
body.holing main::before{display:none}
.glitch .wm,.glitch .status{animation:glitch .09s steps(2) infinite}
.glitch .lockwrap{animation:gshift .12s steps(2) infinite}
@keyframes glitch{0%{text-shadow:3px 0 #ff2a2a,-3px 0 #2affff;transform:translate(2px,-1px) skewX(8deg)}100%{text-shadow:-4px 0 #ff2a2a,4px 0 #2affff;transform:translate(-3px,1px) skewX(-6deg)}}
@keyframes gshift{0%{transform:translate(4px,0);filter:hue-rotate(90deg) saturate(2)}100%{transform:translate(-4px,2px);filter:hue-rotate(-60deg) contrast(1.6)}}
.void{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .8s;pointer-events:none;text-align:center;padding:16px}
.void.on{opacity:1;pointer-events:auto}
.void b{font-size:15px;letter-spacing:.3em;color:var(--bad);text-shadow:0 0 12px rgba(255,77,77,.6)}
.void span{font-size:12px;letter-spacing:.12em;color:#B05050;text-transform:uppercase}
.void .cd{font-size:40px;font-weight:700;color:#C43C3C;letter-spacing:.1em;font-variant-numeric:tabular-nums}
svg.path{display:none}
.dots{display:none}
.wm{cursor:default;-webkit-tap-highlight-color:transparent}
.tries{display:flex;gap:9px;align-items:center;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.tries span{margin-right:2px}
.tries b{width:9px;height:9px;border-radius:50%;display:inline-block}
.tries b.g{background:var(--glow);opacity:.25;animation:ld calc(var(--n) * .45s) infinite;animation-delay:calc(var(--d) * .45s)}
.tries b.used{background:var(--bad);box-shadow:0 0 8px var(--bad);border:0;opacity:1}
@keyframes ld{0%,100%{opacity:.25;box-shadow:none}15%,35%{opacity:1;box-shadow:0 0 8px var(--glow)}}
@media (prefers-reduced-motion:reduce){.tries b.g{animation:none;opacity:1}}
noscript{color:var(--head);padding:20px;display:block}
@media (prefers-reduced-motion:reduce){.status::after{animation:none}.lockwrap.shake{animation:none}.hole::before{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main id="main">
 <div class="wm">PATCHWORK</div>
 <div class="status" id="status" hidden></div>
 <div class="lockwrap" id="lock">
  <div class="grid" id="grid"></div>
  <svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="line" points=""/></svg>
 </div>
 <div class="dots" id="dots" aria-live="polite"></div>
 <div class="tries" id="tries"></div>
</main>
<div class="fade" id="fade"></div>

/* ---------- Sound: Tastentöne (DTMF) wie auf dem Handy ---------- */
let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){return null;}return AC;}
const ROW=[697,770,852],COL=[1209,1336,1477];
function tone(freqs,dur,{type='sine',vol=.16,at=0}={}){const a=ac();if(!a)return;const t=a.currentTime+at;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.setValueAtTime(vol,t+dur-.02);g.gain.linearRampToValueAtTime(0,t+dur);g.connect(a.destination);
 freqs.forEach(f=>{const o=a.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+dur+.02);});}
function keyBeep(i){tone([ROW[Math.floor(i/3)],COL[i%3]],.14,{vol:.13});}
// Entsperr-Sound: eigener Cyber-Glitch (Daten-Stottern, VHS-Rücklauf, dunkler Synth-Akkord)
function unlockTune(){
 const a=ac();if(!a)return 0;const t0=a.currentTime+.02;
 const out=a.createDynamicsCompressor();out.threshold.value=-16;out.ratio.value=5;const mg=a.createGain();mg.gain.value=.85;out.connect(mg);mg.connect(a.destination);
 const crush=a.createWaveShaper();const cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cv[i]=Math.round(x*6)/6;}crush.curve=cv;crush.connect(out);
 const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const blip=(t,f,d,v,type='square',dest=crush)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);};
 // 1) Rückwärts-Anschwellen (Rauschen + Akkord, wird lauter)
 const sw=a.createBufferSource();sw.buffer=nb;const sf=a.createBiquadFilter();sf.type='bandpass';sf.Q.value=3;sf.frequency.setValueAtTime(300,t0);sf.frequency.exponentialRampToValueAtTime(4200,t0+.62);
 const sg=a.createGain();sg.gain.setValueAtTime(.0001,t0);sg.gain.exponentialRampToValueAtTime(.35,t0+.6);sg.gain.linearRampToValueAtTime(0,t0+.64);sw.connect(sf);sf.connect(sg);sg.connect(out);sw.start(t0);sw.stop(t0+.66);
 [110,164.8,220,261.6].forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f*1.003;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.05,t0+.6);g.gain.linearRampToValueAtTime(0,t0+.63);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+.66);});
 // 2) Daten-Stottern (Glitch-Blips)
 const pitches=[1760,2637,1318,3520,880,2093,1567,3136,1174,2793];for(let k=0;k<14;k++){const t=t0+.62+k*.022+(k%3===0?.008:0);blip(t,pitches[k%pitches.length]*(k%2?1:.5),.018,.09);}
 // 3) VHS-Rücklauf / Bandstopp
 const ts=a.createOscillator(),tg=a.createGain(),tf=a.createBiquadFilter();ts.type='sawtooth';ts.frequency.setValueAtTime(900,t0+.95);ts.frequency.exponentialRampToValueAtTime(38,t0+1.25);tf.type='lowpass';tf.frequency.value=1800;
 tg.gain.setValueAtTime(.0001,t0+.95);tg.gain.exponentialRampToValueAtTime(.12,t0+.97);tg.gain.exponentialRampToValueAtTime(.0001,t0+1.27);ts.connect(tf);tf.connect(tg);tg.connect(crush);ts.start(t0+.95);ts.stop(t0+1.3);
 // 4) Dunkler Synth-Akkord (A-Moll add9) mit Sub-Schlag, Filter öffnet sich
 const T=t0+1.3;const lp=a.createBiquadFilter();lp.type='lowpass';lp.Q.value=4;lp.frequency.setValueAtTime(250,T);lp.frequency.exponentialRampToValueAtTime(3200,T+.5);lp.frequency.exponentialRampToValueAtTime(600,T+1.8);lp.connect(out);
 [[55,0],[110,0],[130.8,-7],[164.8,6],[246.9,-5],[329.6,4]].forEach(([f,dt])=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.07,T+.04);g.gain.exponentialRampToValueAtTime(.0001,T+2);o.connect(g);g.connect(lp);o.start(T);o.stop(T+2.05);});
 const sub=a.createOscillator(),sg2=a.createGain();sub.frequency.setValueAtTime(110,T);sub.frequency.exponentialRampToValueAtTime(40,T+.35);sg2.gain.setValueAtTime(.0001,T);sg2.gain.exponentialRampToValueAtTime(.8,T+.01);sg2.gain.exponentialRampToValueAtTime(.0001,T+.6);sub.connect(sg2);sg2.connect(out);sub.start(T);sub.stop(T+.65);
 // 5) Digitales Echo: drei leise Bestätigungs-Blips
 [0,.16,.32].forEach((d,k)=>blip(T+.55+d,[1760,2093,2637][k],.06,.05,'sine',out));
 return 2.1;
}
function errBuzz(){tone([180],.16,{type:'square',vol:.09});tone([140],.26,{type:'square',vol:.09,at:.2});}
function holeSound(){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(28,t+2.6);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+2.9);}

COLORS.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='patch'+(c==='core'?' core':'');b.setAttribute('aria-label','Flicken '+(i+1));if(c==='core')b.textContent='>_';else b.style.background='var('+c+')';b.addEventListener('pointerdown',e=>{e.preventDefault();tap(i);});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i);}});grid.appendChild(b);});
const centers=i=>{const c=i%3,r=Math.floor(i/3);const cell=(100-14)/3;return [c*(cell+7)+cell/2,r*(cell+7)+cell/2];};
function draw(){line.setAttribute('points',seq.map(i=>centers(i).join(',')).join(' '));dots.innerHTML=seq.map(()=>'<i></i>').join('');lock.classList.toggle('busy',busy);}
function tap(i){if(busy||seq.length>=PAYLOAD.len)return;lock.classList.remove('bad');seq.push(i);keyBeep(i);const p=grid.children[i];p.classList.remove('hit');void p.offsetWidth;p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),200);try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}setStatus();draw();
 if(seq.length===PRE)checkPrefix();else if(seq.length===PAYLOAD.len)tryOpen();}
function clearSeq(){if(busy)return;seq=[];lock.classList.remove('bad');setStatus();draw();}
async function pbkdf(str,salt,iter,bits){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(str),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(salt),iterations:iter,hash:'SHA-256'},base,bits));}
async function checkPrefix(){
 const snap=seq.slice(0,PRE).map(i=>i+1).join('-');
 busy=true;draw();
 let ok=false;try{ok=ub64(await pbkdf(snap,PAYLOAD.psalt,PAYLOAD.piter,256))===PAYLOAD.phash;}catch(e){}
 busy=false;draw();
 if(!ok)fail();
 else if(seq.length===PAYLOAD.len)tryOpen();
}
async function decryptWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));return new TextDecoder().decode(pt);}
async function tryOpen(){
 if(busy)return;busy=true;draw();setStatus();
 const combo=seq.map(i=>i+1).join('-');
 try{const raw=await pbkdf(combo,PAYLOAD.salt,PAYLOAD.iter,256);const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const html=await decryptWith(key);
  fails=0;ls.del(FAIL_LS);drawTries();
  setStatus();try{navigator.vibrate&&navigator.vibrate([20,40,20]);}catch(e){}
  launch(html,true);
 }catch(e){busy=false;fail();}
}
function fail(){
 fails++;ls.set(FAIL_LS,String(fails));drawTries();errBuzz();
 setStatus();lock.classList.add('bad','shake');busy=true;draw();
 try{navigator.vibrate&&navigator.vibrate(200);}catch(_){}
 setTimeout(()=>{lock.classList.remove('shake','bad');seq=[];if(fails>=MAXTRY){blackHole();return;}busy=false;draw();},750);
}
