<meta name="theme-color" content="#020A05">
<meta name="apple-mobile-web-app-title" content="Patchwork">
<style>
:root{--bg:#020A05;--glow:#33FF7A;--head:#D8FFE4;--dim:#2E8A4F;--bad:#FF4D4D;--term:#0D1820;
--p1:#C2521A;--p2:#F2D03A;--p3:#1D6786;--p4:#2B7649;--p5:#7A4E2D;--p6:#E58B4E;--p7:#4E9CBB;--p8:#9DB3BE;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--head);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
main::before{content:"";position:absolute;width:min(560px,120vw);height:min(560px,120vw);background:radial-gradient(closest-side,var(--bg) 50%,transparent);z-index:-1}
.wm{font-size:clamp(22px,7vw,34px);font-weight:700;letter-spacing:.3em;padding-left:.3em;color:var(--head);text-shadow:0 0 16px var(--glow)}
.status{font-size:13px;letter-spacing:.12em;color:var(--dim);min-height:1.4em;text-transform:uppercase}
.status::after{content:"\2588";margin-left:4px;color:var(--glow);animation:blink 1s steps(1) infinite}
.status.bad{color:var(--bad)}.status.bad::after{color:var(--bad)}
.status.ok{color:var(--glow)}
@keyframes blink{50%{opacity:0}}
.lockwrap{position:relative;width:min(300px,78vw);aspect-ratio:1}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(min(300px,78vw) * .07)}
.patch{appearance:none;border:0;border-radius:9px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .2s,filter .2s;outline:none;padding:0}
.patch::after{content:"";position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.patch.core{background:var(--term);border:2px solid var(--dim);color:var(--glow);font-family:var(--mono);font-weight:700;font-size:clamp(20px,7vw,30px)}
.patch.core::after{border-color:rgba(51,255,122,.25)}
.patch:active,.patch.hit{transform:scale(.9)}
.patch.hit{box-shadow:0 0 0 3px var(--glow),0 0 26px var(--glow);filter:brightness(1.25)}
.patch:focus-visible{box-shadow:0 0 0 3px var(--head)}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.path polyline{fill:none;stroke:var(--glow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--glow));opacity:.85}
.lockwrap.shake{animation:shake .45s}
.lockwrap.bad .patch{filter:grayscale(.6) brightness(.7)}
.lockwrap.bad svg.path polyline{stroke:var(--bad);filter:drop-shadow(0 0 5px var(--bad))}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.dots{display:flex;gap:7px;min-height:12px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.row{display:flex;gap:10px}
button.act{appearance:none;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--dim);background:transparent;color:var(--head)}
button.act.go{background:var(--glow);color:var(--bg);border-color:var(--glow);box-shadow:0 0 16px rgba(51,255,122,.45)}
button.act[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
label.keep{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);letter-spacing:.06em;cursor:pointer}
label.keep input{accent-color:var(--glow);width:16px;height:16px}
.fly{position:fixed;border-radius:6px;pointer-events:none;z-index:5}
.fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
.fade.on{opacity:1}
noscript{color:var(--head);padding:20px;display:block}
@media (prefers-reduced-motion:reduce){.status::after{animation:none}.lockwrap.shake{animation:none}}
</style>
</head>

  <div class="grid" id="grid"></div>
  <svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="line" points=""/></svg>
 </div>
 <div class="dots" id="dots" aria-live="polite"></div>
 <div class="row"><button class="act" id="clear" type="button">Löschen</button><button class="act go" id="open" type="button" disabled>Öffnen</button></div>
 <label class="keep"><input type="checkbox" id="keep"> Auf diesem Gerät merken</label>
</main>

const KEY_LS='patchwork-lock-key-v1';
const COLORS=['--p1','--p2','--p3','--p4','core','--p5','--p6','--p7','--p8'];
const grid=document.getElementById('grid'),line=document.getElementById('line'),dots=document.getElementById('dots'),statusEl=document.getElementById('status'),lock=document.getElementById('lock'),openBtn=document.getElementById('open');
const MIN=6,MAX=16;let seq=[],busy=false;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
function setStatus(t,cls){statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='patch'+(c==='core'?' core':'');b.setAttribute('aria-label','Flicken '+(i+1));if(c==='core')b.textContent='>_';else b.style.background='var('+c+')';b.addEventListener('pointerdown',e=>{e.preventDefault();tap(i);});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i);}});grid.appendChild(b);});
const centers=i=>{const c=i%3,r=Math.floor(i/3);const cell=(100-14)/3;return [c*(cell+7)+cell/2,r*(cell+7)+cell/2];};
function draw(){line.setAttribute('points',seq.map(i=>centers(i).join(',')).join(' '));dots.innerHTML=seq.map(()=>'<i></i>').join('');openBtn.disabled=busy||seq.length<MIN;}
function tap(i){if(busy)return;lock.classList.remove('bad');if(seq.length>=MAX)return;seq.push(i);const p=grid.children[i];p.classList.remove('hit');void p.offsetWidth;p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),220);try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}setStatus(seq.length<MIN?'Kombination eingeben':'Bereit zum Öffnen');draw();}
function clearSeq(){if(busy)return;seq=[];lock.classList.remove('bad');setStatus('Kombination eingeben');draw();}
async function deriveKey(combo){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(combo),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function decryptWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));return new TextDecoder().decode(pt);}
function launch(html){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const go=()=>{document.open();document.write(html);document.close();};
 if(reduce){go();return;}
 [...grid.children].forEach((p,i)=>{const r=p.getBoundingClientRect();const d=document.createElement('div');d.className='fly';Object.assign(d.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:COLORS[i]==='core'?'var(--term)':'var('+COLORS[i]+')',boxShadow:'0 0 20px var(--glow)'});document.body.appendChild(d);p.style.visibility='hidden';const a=Math.atan2(r.top+r.height/2-innerHeight/2,r.left+r.width/2-innerWidth/2)+(i===4?Math.PI/2:0);const dist=Math.max(innerWidth,innerHeight);d.animate([{transform:'none',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) rotate(${(Math.random()-.5)*540}deg) scale(.4)`,opacity:0}],{duration:900,delay:i*35,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});});
 setTimeout(()=>document.getElementById('fade').classList.add('on'),650);
 setTimeout(go,1150);
}
async function tryOpen(){
 if(busy||seq.length<MIN)return;busy=true;draw();setStatus('Entschlüssle …');
 const combo=seq.map(i=>i+1).join('-');
 try{const key=await deriveKey(combo);const html=await decryptWith(key);
  if(document.getElementById('keep').checked){try{localStorage.setItem(KEY_LS,ub64(new Uint8Array(await crypto.subtle.exportKey('raw',key))));}catch(e){}}
  setStatus('Zugriff gewährt','ok');try{navigator.vibrate&&navigator.vibrate([20,40,20]);}catch(e){}
  launch(html);
 }catch(e){busy=false;setStatus('Zugriff verweigert','bad');lock.classList.add('bad','shake');try{navigator.vibrate&&navigator.vibrate(200);}catch(_){}setTimeout(()=>{lock.classList.remove('shake');seq=[];draw();},700);}
}
document.getElementById('clear').addEventListener('click',clearSeq);
openBtn.addEventListener('click',tryOpen);
document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))tap(+e.key-1);else if(e.key==='Backspace'){seq.pop();draw();}else if(e.key==='Enter')tryOpen();else if(e.key==='Escape')clearSeq();});
(async()=>{let k=null;try{k=localStorage.getItem(KEY_LS);}catch(e){}if(!k)return;
 try{busy=true;draw();setStatus('Gespeicherter Schlüssel …');const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt']);const html=await decryptWith(key);setStatus('Zugriff gewährt','ok');launch(html);}
 catch(e){try{localStorage.removeItem(KEY_LS);}catch(_){}busy=false;setStatus('Kombination eingeben');draw();}})();
